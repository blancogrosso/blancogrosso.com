<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Página no encontrada | Blanco Grosso</title>
<link rel="icon" type="image/png" href="/img/icons/logo-verde.png">
<link rel="preload" href="/fonts/archivo-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* antes de pintar: el idioma elegido en la web (misma clave que la home y los casos) */
(function(){ try { if (localStorage.getItem('bg-lang') === 'en') { var d = document.documentElement; d.classList.add('lang-en-active'); d.lang = 'en'; document.title = 'Page not found | Blanco Grosso'; } } catch (e) {} })();
</script>
<style>
@font-face{font-family:'Archivo';src:url(/fonts/archivo-variable-latin.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{--bg:#050505;--fg:#f0f0f0;--muted:#a8a8a8;--accent:#00ff88;--accent-hover:#7dffc0;--on-accent:#03140b;--gutter:clamp(16px,4vw,48px);
  --grad:linear-gradient(-45deg,#00ff88,#00ffa2,#00ffcc,#00cc88,#00ff88);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.grad{background:var(--grad);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flow 8s ease infinite}
.mesh{position:fixed;inset:-10%;background:radial-gradient(40% 50% at 18% 25%,rgba(0,255,136,.12),transparent 70%),radial-gradient(40% 45% at 85% 80%,rgba(0,204,255,.08),transparent 70%),radial-gradient(35% 35% at 70% 12%,rgba(139,0,255,.07),transparent 70%)}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px}
/* piezas sueltas de fondo: el muro desarmado */
.loose{position:fixed;inset:0;pointer-events:none}
.loose img{position:absolute;width:clamp(90px,11vw,170px);aspect-ratio:1;object-fit:cover;border-radius:10px;opacity:.16;filter:saturate(.7);will-change:transform}
.nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) var(--gutter);z-index:3}
.mark{font-weight:900;font-stretch:125%;font-size:18px;letter-spacing:-.03em;line-height:.9;text-decoration:none}
.mark span{display:block}
main{position:relative;z-index:2;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--gutter)}
.code{margin:0;font-weight:900;font-stretch:125%;font-size:clamp(120px,min(30vw,42.3svh),380px);line-height:.8;letter-spacing:-.06em;position:relative}
.code .glow{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55),transparent 22%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:0;transition:opacity .4s;pointer-events:none}
.code:hover .glow{opacity:1}
h1{margin:clamp(18px,3vh,32px) 0 0;font-weight:800;font-stretch:112%;font-size:clamp(26px,4vw,44px);letter-spacing:-.03em;line-height:1.05}
p{margin:12px 0 0;color:var(--muted);font-size:clamp(16px,1.6vw,19px);max-width:42ch}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:30px}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-size:16px;font-weight:600;white-space:nowrap;text-decoration:none;transition:color .25s,border-color .25s,transform .12s}
.btn::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;transform:scaleX(0);transform-origin:left center;transition:transform .45s cubic-bezier(.19,1,.22,1)}
.btn:hover::before,.btn:focus-visible::before{transform:scaleX(1)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary::before{background:var(--accent-hover)}
.btn-ghost{border:1px solid rgba(255,255,255,.45);color:var(--fg)}
.btn-ghost::before{background:var(--accent)}
.btn-ghost:hover,.btn-ghost:focus-visible{color:var(--on-accent);border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn svg{width:18px;height:18px;transition:transform .25s}
.btn:hover svg{transform:translateX(-3px)}
/* entrada */
.in{opacity:0;transform:translateY(24px);animation:up .9s cubic-bezier(.19,1,.22,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.in{opacity:1;transform:none}.code:hover .glow{opacity:0}.loose img{will-change:auto}.btn:hover svg,.btn:active{transform:none}}
.lang-en{display:none}
.lang-en-active .lang-es{display:none}
.lang-en-active .lang-en{display:inline}
</style>
</head>
<body>
<div class="mesh"></div><div class="grid"></div>
<div class="loose" id="loose" aria-hidden="true"></div>
<header class="nav"><a class="mark grad" id="mark" href="/" aria-label="Blanco Grosso, inicio"><span>BLANCO</span><span>GROSSO</span></a></header>
<main>
  <div class="code in" id="code" aria-hidden="true"><span class="grad">404</span><span class="glow">404</span></div>
  <h1 class="in" style="animation-delay:.12s"><span class="lang-es">Fuera de juego.</span><span class="lang-en" lang="en">Offside.</span></h1>
  <p class="in" style="animation-delay:.2s"><span class="lang-es">Esta página no existe o cambió de lugar. El trabajo sigue en la cancha.</span><span class="lang-en" lang="en">This page doesn't exist or has moved. The work is still on the pitch.</span></p>
  <div class="acts in" style="animation-delay:.28s">
    <a class="btn btn-primary" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span class="lang-es">Volver al inicio</span><span class="lang-en" lang="en">Back home</span></a>
    <a class="btn btn-ghost" href="/#trabajos"><span class="lang-es">Ver trabajos</span><span class="lang-en" lang="en">See work</span></a>
  </div>
</main>
<script>
(function(){
  var T = ["/img/muro/bufarra-kithome-final-edit.avif", "/img/muro/bufarra-umbro-hero.avif", "/img/muro/by-kafuse-estudio-1.avif", "/img/muro/iris-lab-final.avif", "/img/muro/nido-feed-post-01-apertura.avif", "/img/muro/sport-editorial-toni.avif", "/img/muro/serie-rio-plata-1.avif", "/img/muro/bufarra-kithome-foto-estudio-hype.avif", "/img/muro/iris-lab-iris-luxemburgo.avif", "/img/muro/by-kafuse-detalle-1.avif"], loose = document.getElementById('loose');
  // piezas del muro sueltas, como si se hubieran desarmado
  var P = [[6,14,-8],[78,10,6],[12,70,5],[84,64,-7],[40,82,-4],[60,6,3],[90,38,9],[2,42,-3],[66,84,7],[26,4,-6]];
  P.forEach(function(p, i){ var im = new Image(); im.alt = ''; im.decoding = 'async'; im.src = T[i % T.length]; im.style.left = p[0] + '%'; im.style.top = p[1] + '%'; im.dataset.r = p[2]; im.dataset.z = (.4 + (i % 4) * .2); loose.appendChild(im); });
  var imgs = Array.prototype.slice.call(loose.children), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (document.documentElement.lang === 'en') document.getElementById('mark').setAttribute('aria-label', 'Blanco Grosso, home');
  var mx = 0, my = 0, tx = 0, ty = 0, code = document.getElementById('code');
  if (!reduce) addEventListener('pointermove', function(e){
    tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5;
    var r = code.getBoundingClientRect(); code.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%'); code.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  }, { passive: true });
  function frame(now){
    mx += (tx - mx) * .06; my += (ty - my) * .06; var t = now / 1000;
    imgs.forEach(function(im, i){ var z = +im.dataset.z, f = Math.sin(t * .4 + i) * 6;
      im.style.transform = 'translate3d(' + (-mx * 60 * z).toFixed(1) + 'px,' + (-my * 60 * z + f).toFixed(1) + 'px,0) rotate(' + im.dataset.r + 'deg)'; });
    requestAnimationFrame(frame);
  }
  if(!reduce) requestAnimationFrame(frame); else imgs.forEach(function(im){ im.style.transform = 'rotate(' + im.dataset.r + 'deg)'; });
})();
</script>
</body>
</html>
